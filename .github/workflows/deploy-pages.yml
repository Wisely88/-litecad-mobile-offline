name: Build LiteCAD for branch Pages

on:
  push:
    branches: [main]
    paths:
      - 'source/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: litecad-branch-build
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build application
        shell: bash
        run: |
          set -euo pipefail
          if [ -f source/package.json ]; then
            APP_DIR="source"
          else
            APP_DIR="."
          fi
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          cd "$APP_DIR"
          npm install --no-audit --no-fund
          npm run build

      - name: Put production build at branch root
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$RUNNER_TEMP/litecad-dist" "$RUNNER_TEMP/litecad-source"
          mkdir -p "$RUNNER_TEMP/litecad-dist"
          cp -a "$APP_DIR/dist/." "$RUNNER_TEMP/litecad-dist/"

          if [ "$APP_DIR" = "." ]; then
            mkdir -p "$RUNNER_TEMP/litecad-source"
            for item in index.html package.json package-lock.json tsconfig.json vite.config.ts README.md THIRD_PARTY-NOTICES.md src public; do
              if [ -e "$item" ]; then
                cp -a "$item" "$RUNNER_TEMP/litecad-source/"
              fi
            done
          fi

          find . -mindepth 1 -maxdepth 1             ! -name .git             ! -name .github             ! -name source             -exec rm -rf {} +

          if [ "$APP_DIR" = "." ]; then
            rm -rf source
            mkdir -p source
            cp -a "$RUNNER_TEMP/litecad-source/." source/
          fi

          cp -a "$RUNNER_TEMP/litecad-dist/." .
          touch .nojekyll
          printf '%s\n' "Built automatically from source/ by GitHub Actions." > BUILD_INFO.txt

      - name: Commit production build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No production changes to commit."
            exit 0
          fi
          git commit -m "Deploy LiteCAD production build [skip ci]"
          git push origin HEAD:main
