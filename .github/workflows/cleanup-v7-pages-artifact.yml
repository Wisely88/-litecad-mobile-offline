name: Cleanup v7 Pages artifact

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-v7-pages-artifact.yml'

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete stale Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method DELETE             /repos/Wisely88/-litecad-mobile-offline/actions/artifacts/10582426339
          echo "Deleted stale Pages artifact 10582426339"
